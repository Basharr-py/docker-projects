services:
    client:
        image: basharr99/app-frontend:1.1
        networks:
            - frontend
        restart: unless-stopped
        ports:
            - 3000:3000
        healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
            interval: 100s
            timeout: 3s
            retries: 3
        depends_on:
            db:
                condition: service_healthy

    fast-api:
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
            timeout: 3s
            retries: 3
            interval: 100s
        image: basharr99/fast-api:1.0
        restart: unless-stopped
        networks:
            - frontend
            - backend
        ports:
            - 8000:8000
        depends_on:
            db:
                condition: service_healthy


    db:
        image: postgres:16
        restart: unless-stopped
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_USER=${POSTGRES_USER}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD", "pg_isready", "-U${POSTGRES_USER}", "-d${POSTGRES_DB}"]
            interval: 3s
            timeout: 5s
            retries: 3
        networks:
            - backend
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        ports:
            - 80:80
        networks:
            - backend
            - frontend
        depends_on:
            db:
                condition: service_healthy

networks:
    backend:
        name: backend
    frontend:
        name: frontend

volumes:
    postgres_data:
        name: postgres_data
